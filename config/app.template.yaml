# Application Configuration Template

This is a disposable template used for the onboarding workshop drill.

```yaml
# --- App settings ---
app:
  environment: development
  log_level: info
  max_connections: 10

# --- Database settings ---
database:
  host: localhost
  port: 5432
  name: app_db
  pool_size: 5

# --- Feature flags ---
feature_flags:
  enable_dashboard: true
  enable_experimental_api: false
```

Replace the placeholder values with real values before use.
